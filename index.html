<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yueheng Fu</title>
    <meta name="description" content="Yueheng Fu, first-year Systems Design Engineering student at the University of Waterloo." />
    <meta name="theme-color" content="#0d0d0e" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Theme before first paint: a stored choice, else the system's, else dark.
      ;(function () {
        var t
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
