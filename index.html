<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yueheng Fu</title>
    <meta name="description" content="Yueheng Fu, first-year Systems Design Engineering student at the University of Waterloo. Experience, projects and contact." />
    <meta property="og:title" content="Yueheng Fu" />
    <meta property="og:description" content="First-year Systems Design Engineering student at the University of Waterloo." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0d0d0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/models/meowmeow.obj" as="fetch" crossorigin />
    <script>
      // Pick the theme before first paint: a saved choice, else the OS setting, else dark.
      ;(function () {
        var t
        try { t = localStorage.getItem('theme') } catch (e) { /* storage blocked */ }
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
